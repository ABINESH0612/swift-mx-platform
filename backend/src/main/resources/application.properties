
spring.application.name=swift-mx

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/swift_mx_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:abinesh@2006}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Server
server.port=8080

# Authentication
app.security.username=${APP_AUTH_USERNAME:admin}
app.security.password=${APP_AUTH_PASSWORD:admin123}

# File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
