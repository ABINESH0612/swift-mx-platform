# ==============================================================
# MySQL Test Profile Configuration
# Activated with: -Dspring.profiles.active=mysql-test
# Requires a live MySQL instance with schema swift_mx_db
# ==============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/swift_mx_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.security.username=${APP_AUTH_USERNAME:admin}
app.security.password=${APP_AUTH_PASSWORD:admin123}
