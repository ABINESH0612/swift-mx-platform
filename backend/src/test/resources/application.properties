# ==============================================================
# Isolated Test Application Configuration
# Uses H2 In-Memory database with MySQL compatibility mode
# Ensures tests run without external dependencies and never touch production data
# ==============================================================
spring.application.name=swift-mx-test

spring.datasource.url=jdbc:h2:mem:swift_mx_testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Default Test Security Credentials
app.security.username=admin
app.security.password=admin123
